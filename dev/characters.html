<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Afterlife Lease — Character Lab</title>
    <style>
      :root { --plum: #1d1726; --bone: #e8e0c8; --toxic: #9fe870; --candle: #ffb35a; }
      html, body { margin: 0; height: 100%; background: var(--plum); color: var(--bone); overflow: hidden;
        font: 12px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      #panel { position: fixed; top: 10px; left: 10px; width: 330px; max-height: calc(100% - 20px); overflow: auto;
        background: rgba(29, 23, 38, 0.86); border: 1px solid rgba(232, 224, 200, 0.15); border-radius: 12px;
        padding: 10px 12px; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
      #panel h1 { font: 600 15px "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; margin: 0 0 6px; }
      #panel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .7; margin: 10px 0 4px; }
      .row { display: flex; flex-wrap: wrap; gap: 4px; }
      button, select { background: rgba(232,224,200,.08); color: var(--bone); border: 1px solid rgba(232,224,200,.2);
        border-radius: 6px; padding: 3px 6px; font: inherit; cursor: pointer; }
      button.on { border-color: var(--toxic); color: var(--toxic); }
      input[type=range] { width: 100%; }
      #stats { position: fixed; right: 10px; bottom: 10px; background: rgba(29,23,38,.8); border-radius: 8px;
        padding: 6px 9px; font-family: ui-monospace, monospace; white-space: pre; }
      body.shot #panel, body.shot #stats { display: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="panel"></div>
    <div id="stats"></div>
    <script type="module" src="/src/render/characters/dev/viewer.ts"></script>
  </body>
</html>
